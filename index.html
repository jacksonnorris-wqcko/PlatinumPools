<body><div class="shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="./platinum-pools-logo.png" alt="Platinum Pools NSW logo"><h1>PLATINUM OPS</h1><p>INTERNAL BUSINESS TOOL</p></div><nav class="nav" id="sideNav"><button data-page="dashboard" class="active"><span class="ico">⌂</span>Overview</button><button data-page="jobs"><span class="ico">▤</span>Jobs & Plans</button><button data-page="quotes"><span class="ico">＄</span>Quoting</button><button data-page="calendar"><span class="ico">▦</span>Calendar & Diary</button><button data-page="earthworks"><span class="ico">▱</span>Earthworks Calc</button><button data-page="resources"><span class="ico">↗</span>NSW Resources</button></nav><div class="side-foot"><b>PRIVATE BUSINESS TOOL</b>Designed for internal use<br>Version <span class="versionText">v0.0.4</span></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">PLATINUM POOLS NSW</div><h2 id="topTitle">Operations overview</h2></div><div class="top-right"><span class="version">v0.0.4 · BETA</span><img class="avatar" src="./platinum-pools-logo.png" alt="Platinum Pools NSW"></div></header><div class="content" id="app"></div></main></div><nav class="mobile-nav" id="mobileNav"><button data-page="dashboard" class="active"><span>⌂</span>Home</button><button data-page="jobs"><span>▤</span>Jobs</button><button data-page="quotes"><span>＄</span>Quotes</button><button data-page="calendar"><span>▦</span>Diary</button><button data-page="earthworks"><span>▱</span>Calc</button><button data-page="resources"><span>↗</span>Links</button></nav><div id="toast" class="toast hidden"></div>
<script>
const VERSION='0.0.4';const STORE='platinum-ops-v001';let state={page:'dashboard',jobs:[],quotes:[],events:[],editingJob:null,editingQuote:null,editingEvent:null,calendarDate:new Date().toISOString().slice(0,10),calendarMonth:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'{}');state.jobs=Array.isArray(d.jobs)?d.jobs:[];state.quotes=Array.isArray(d.quotes)?d.quotes:[];state.events=Array.isArray(d.events)?d.events:[]}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify({jobs:state.jobs,quotes:state.quotes,events:state.events}));render()}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2400)}
function go(p){state.page=p;state.editingJob=null;state.editingQuote=null;render();window.scrollTo(0,0)}
function setNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const titles={dashboard:'Operations overview',jobs:'Jobs & plans',quotes:'Quoting workspace',earthworks:'Earthworks calculator',resources:'NSW pool resources',calendar:'Calendar & day diary'};$('#topTitle').textContent=titles[state.page]||'Operations overview'}
function statusClass(s){return s==='Quoted'?'quoted':s==='Planning'?'planning':''}
function dashboard(){const active=state.jobs.filter(j=>!['Completed','Lost'].includes(j.status)).length;const quoted=state.quotes.reduce((a,q)=>a+Number(q.total||0),0);return `<section class="hero"><div><div class="eyebrow">BUILT FOR THE JOB SITE</div><h3>Good work starts<br>with a clear plan.</h3><p>Your private workspace for pool jobs, quotes, site calculations and the NSW guidelines you need close at hand.</p></div><div class="hero-actions"><button class="btn primary" onclick="newJob()">＋ New job</button><button class="btn light" onclick="newQuote()">＋ Build a quote</button></div></section><section class="stats"><div class="stat"><div class="label">Active jobs</div><div class="num">${active}</div><div class="hint">In progress / planning</div></div><div class="stat"><div class="label">Stored jobs</div><div class="num">${state.jobs.length}</div><div class="hint">Job records on this device</div></div><div class="stat"><div class="label">Quotes created</div><div class="num">${state.quotes.length}</div><div class="hint">Saved quote drafts</div></div><div class="stat"><div class="label">Quote total</div><div class="num" style="font-size:22px">${money(quoted)}</div><div class="hint">Combined saved quotes</div></div></section><div class="dash-grid"><section class="panel"><div class="panel-title"><h3>Recent jobs</h3><button class="btn outline small" onclick="go('jobs')">View all →</button></div>${state.jobs.length?`<div class="job-list">${state.jobs.slice(0,5).map(j=>`<div class="job-row"><div class="job-symbol">▤</div><div class="job-info"><b>${esc(j.name||'Untitled job')}</b><small>${esc(j.client||'No client')} · ${esc(j.suburb||'No location')}</small></div><span class="status ${statusClass(j.status)}">${esc(j.status||'Lead')}</span><button class="btn outline small" onclick="editJob('${j.id}')">Open</button></div>`).join('')}</div>`:`<div class="empty">No jobs yet. Create your first job to start storing client details, notes and plan references.</div>`}</section><section class="panel"><div class="panel-title"><h3>Quick tools</h3><span>Shortcuts</span></div><div class="quick-grid"><button class="quick" onclick="newQuote()"><div class="qico">＄</div><b>Build a quote</b><small>Items, quantities & totals</small></button><button class="quick" onclick="go('earthworks')"><div class="qico">▱</div><b>Earthworks volume</b><small>Cut volume & swell estimate</small></button><button class="quick" onclick="go('resources')"><div class="qico">↗</div><b>Pool guidelines</b><small>NSW government links</small></button><button class="quick" onclick="go('jobs')"><div class="qico">▧</div><b>Job & plan register</b><small>Find project details</small></button></div></section></div><section class="panel" style="margin-top:18px"><div class="panel-title"><h3>Keep in mind</h3><span>v0.0.4 branded build</span></div><div style="font-size:12px;color:var(--muted)">This first version stores records in this browser on this device. Export a backup regularly and avoid storing sensitive client documents until secure cloud storage and access controls are added. Pool compliance and excavation quantities must be checked against the actual site, approved plans and current requirements.</div></section>`}
function newJob(){state.editingJob=null;state.page='jobs';render(true)}function editJob(id){state.editingJob=state.jobs.find(j=>j.id===id)||null;state.page='jobs';render(true)}
function jobsPage(showForm=false){if(showForm||state.editingJob){const j=state.editingJob||{};return `<div class="page-head"><div><div class="eyebrow">PROJECT REGISTER</div><h3>${j.id?'Edit job':'Create a job'}</h3><p>Keep the job basics and plan/document references together.</p></div><button class="btn outline" onclick="state.editingJob=null;render()">← Back to jobs</button></div><section class="panel"><form onsubmit="saveJob(event)"><div class="form-grid"><div class="field"><label>Job name / reference *</label><input name="name" required value="${esc(j.name)}" placeholder="e.g. Smith — Shell Cove pool"></div><div class="field"><label>Client name</label><input name="client" value="${esc(j.client)}" placeholder="Client / builder"></div><div class="field"><label>Site address</label><input name="address" value="${esc(j.address)}" placeholder="Street address"></div><div class="field"><label>Suburb</label><input name="suburb" value="${esc(j.suburb)}" placeholder="e.g. Kiama"></div><div class="field"><label>Job status</label><select name="status">${['Lead','Quoting','Quoted','Planning','Scheduled','In progress','Completed','Lost'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Target start date</label><input type="date" name="date" value="${esc(j.date)}"></div><div class="field"><label>Pool type / model</label><input name="pool" value="${esc(j.pool)}" placeholder="Fibreglass / plunge / model"></div><div class="field"><label>Plan / document reference</label><input name="plan" value="${esc(j.plan)}" placeholder="File name, Drive link or server path"></div><div class="field full"><label>Site notes / approvals / access</label><textarea name="notes" placeholder="Access, soil, rock, services, approvals, customer requirements...">${esc(j.notes)}</textarea></div></div><div class="form-actions"><button type="button" class="btn outline" onclick="state.editingJob=null;render()">Cancel</button><button class="btn primary">Save job</button></div><input type="hidden" name="id" value="${esc(j.id)}"></form></section>`}
return `<div class="page-head"><div><div class="eyebrow">PROJECT REGISTER</div><h3>Jobs & plans</h3><p>One place for client details, site notes and plan references.</p></div><button class="btn primary" onclick="newJob()">＋ New job</button></div><div class="notice">v0.0.4 stores plan references and links, not uploaded plan files. Attachments and secure cloud storage can be added in a later version.</div><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Job</th><th>Client</th><th>Location</th><th>Status</th><th>Plan ref</th><th>Action</th></tr></thead><tbody>${state.jobs.length?state.jobs.map(j=>`<tr><td><b>${esc(j.name)}</b><br><span style="color:var(--muted)">${esc(j.pool||'')}</span></td><td>${esc(j.client||'—')}</td><td>${esc(j.suburb||j.address||'—')}</td><td><span class="status ${statusClass(j.status)}">${esc(j.status||'Lead')}</span></td><td>${j.plan?`<a href="${/^https?:\/\//i.test(j.plan)?esc(j.plan):'#'}" ${/^https?:\/\//i.test(j.plan)?'target="_blank" rel="noopener"':'onclick="return false"'}>${esc(j.plan)}</a>`:'—'}</td><td><button class="btn outline small" onclick="editJob('${j.id}')">Edit</button> <button class="btn danger small" onclick="deleteJob('${j.id}')">×</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No jobs saved yet.</div></td></tr>`}</tbody></table></div><div class="form-actions"><button class="btn outline" onclick="exportData()">↓ Export backup</button><button class="btn outline" onclick="$('#importFile').click()">↑ Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></section>`}
function saveJob(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const id=d.id||crypto.randomUUID();const obj={...d,id,updated:new Date().toISOString()};const i=state.jobs.findIndex(j=>j.id===id);if(i>=0)state.jobs[i]=obj;else state.jobs.unshift(obj);state.editingJob=null;save();toast('Job saved on this device')}
function deleteJob(id){if(confirm('Delete this job from this device?')){state.jobs=state.jobs.filter(j=>j.id!==id);save();toast('Job deleted')}}
function newQuote(){state.editingQuote=null;state.page='quotes';render(true)}function editQuote(id){state.editingQuote=state.quotes.find(q=>q.id===id)||null;state.page='quotes';render(true)}
function quotePage(showForm=false){if(showForm||state.editingQuote){const q=state.editingQuote||{};let items=q.items||[{desc:'Pool supply / installation',qty:1,rate:0}];return `<div class="page-head"><div><div class="eyebrow">ESTIMATING</div><h3>${q.id?'Edit quote':'Build a quote'}</h3><p>Prepare a draft estimate with itemised allowances.</p></div><button class="btn outline" onclick="state.editingQuote=null;render()">← Back to quotes</button></div><section class="panel"><form id="quoteForm" onsubmit="saveQuote(event)"><div class="form-grid"><div class="field"><label>Quote title *</label><input name="title" required value="${esc(q.title)}" placeholder="e.g. Smith pool installation"></div><div class="field"><label>Client</label><input name="client" value="${esc(q.client)}" placeholder="Client name"></div><div class="field"><label>Linked job</label><select name="jobId"><option value="">No linked job</option>${state.jobs.map(j=>`<option value="${j.id}" ${q.jobId===j.id?'selected':''}>${esc(j.name)}</option>`).join('')}</select></div><div class="field"><label>GST rate (%)</label><input name="gst" type="number" min="0" max="100" step="0.1" value="${q.gst??10}"></div></div><div class="section-head"><div><h3>Quote items</h3><p>Enter quantities and unit prices excluding GST.</p></div><button type="button" class="btn outline small" onclick="addQuoteLine()">＋ Add item</button></div><div class="line-items" id="quoteItems">${items.map((it,i)=>lineHtml(it,i)).join('')}</div><div class="quote-totals"><div class="total-row"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="total-row"><span>GST</span><b id="gstTotal">$0.00</b></div><div class="total-row grand"><span>Total incl. GST</span><b id="grandTotal">$0.00</b></div></div><div class="field" style="margin-top:18px"><label>Notes / exclusions / validity</label><textarea name="notes">${esc(q.notes)}</textarea></div><div class="form-actions"><button type="button" class="btn outline" onclick="state.editingQuote=null;render()">Cancel</button><button type="button" class="btn outline" onclick="printQuote()">Print / Save PDF</button><button class="btn primary">Save quote</button></div><input type="hidden" name="id" value="${esc(q.id)}"></form></section>`}
return `<div class="page-head"><div><div class="eyebrow">ESTIMATING</div><h3>Quoting workspace</h3><p>Draft itemised quotes, then print or save as PDF.</p></div><button class="btn primary" onclick="newQuote()">＋ New quote</button></div><div class="notice">This is an internal draft tool, not accounting software. Confirm pricing, GST treatment, inclusions and contract terms before issuing a quote.</div><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Quote</th><th>Client</th><th>Items</th><th>Total incl. GST</th><th>Action</th></tr></thead><tbody>${state.quotes.length?state.quotes.map(q=>`<tr><td><b>${esc(q.title)}</b></td><td>${esc(q.client||'—')}</td><td>${(q.items||[]).length}</td><td><b>${money(q.total)}</b></td><td><button class="btn outline small" onclick="editQuote('${q.id}')">Edit</button> <button class="btn danger small" onclick="deleteQuote('${q.id}')">×</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No saved quotes yet.</div></td></tr>`}</tbody></table></div><div class="form-actions"><button class="btn outline" onclick="exportData()">↓ Export backup</button></div></section>`}
function lineHtml(it,i){return `<div class="line-item"><input aria-label="Item description" placeholder="Description" value="${esc(it.desc)}" data-desc><input aria-label="Quantity" type="number" min="0" step="0.01" placeholder="Qty" value="${Number(it.qty)||0}" data-qty><input aria-label="Unit price ex GST" type="number" min="0" step="0.01" placeholder="$ / unit" value="${Number(it.rate)||0}" data-rate><button type="button" class="btn danger small" onclick="this.parentElement.remove();calcQuote()">×</button></div>`}
function addQuoteLine(){const box=$('#quoteItems');box.insertAdjacentHTML('beforeend',lineHtml({desc:'',qty:1,rate:0},box.children.length));calcQuote()}
function calcQuote(){const rows=[...document.querySelectorAll('#quoteItems .line-item')];let subtotal=0;rows.forEach(r=>subtotal+=(Number(r.querySelector('[data-qty]').value)||0)*(Number(r.querySelector('[data-rate]').value)||0));const gstRate=Number(document.querySelector('[name="gst"]')?.value)||0;$('#subtotal').textContent=money(subtotal);$('#gstTotal').textContent=money(subtotal*gstRate/100);$('#grandTotal').textContent=money(subtotal*(1+gstRate/100));return {subtotal,gst:subtotal*gstRate/100,total:subtotal*(1+gstRate/100),items:rows.map(r=>({desc:r.querySelector('[data-desc]').value,qty:Number(r.querySelector('[data-qty]').value)||0,rate:Number(r.querySelector('[data-rate]').value)||0}))}}
function saveQuote(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const c=calcQuote();const id=d.id||crypto.randomUUID();const obj={...d,id,...c,updated:new Date().toISOString()};const i=state.quotes.findIndex(q=>q.id===id);if(i>=0)state.quotes[i]=obj;else state.quotes.unshift(obj);state.editingQuote=null;save();toast('Quote saved on this device')}
function deleteQuote(id){if(confirm('Delete this quote from this device?')){state.quotes=state.quotes.filter(q=>q.id!==id);save();toast('Quote deleted')}}
function printQuote(){const f=$('#quoteForm');const c=calcQuote();const data=Object.fromEntries(new FormData(f).entries());const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print this quote');return}w.document.write(`<html><head><title>${esc(data.title)}</title><style>body{font:14px Arial;padding:35px;color:#17212b}h1{margin-bottom:3px}small{color:#555}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}td:last-child,th:last-child{text-align:right}.totals{margin:25px 0 0 auto;width:250px}.totals p{display:flex;justify-content:space-between}.notes{white-space:pre-wrap;margin-top:30px}

  .content{padding-top:18px}
  .stat,.panel{box-shadow:0 3px 14px #15283b08}
  .mobile-nav{padding-left:max(5px,env(safe-area-inset-left));padding-right:max(5px,env(safe-area-inset-right))}
}
@media(max-width:380px){
  .topbar h2{font-size:14px}
  .version{font-size:8px;padding:4px 5px}
  .avatar{height:28px;width:28px}
}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.calendar-month{font-size:20px;font-weight:800}.calendar-controls{display:flex;gap:7px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-weekday{text-align:center;font-size:10px;text-transform:uppercase;color:var(--muted);padding:8px 0;font-weight:800}.calendar-day{min-height:78px;border:1px solid var(--line);border-radius:9px;background:white;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--ink)}.calendar-day.outside{background:#f7f9fa;color:#a9b2bb}.calendar-day.selected{border:2px solid var(--gold);padding:5px;background:#f0fbfc}.calendar-day.today .day-num{background:var(--navy);color:white}.day-num{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;font-size:11px;font-weight:800}.day-dots{display:flex;gap:3px;flex-wrap:wrap}.day-dot{width:7px;height:7px;border-radius:50%;background:#35b7c9}.day-dot.meeting{background:#3c75b5}.day-dot.council{background:#8b6bc4}.day-dot.site{background:#2e8a68}.day-dot.personal{background:#d49a36}.day-event-count{font-size:9px;color:var(--muted)}.agenda-event{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-top:1px solid #edf0f3}.agenda-event:first-child{border-top:0}.event-time{min-width:62px;color:var(--muted);font-size:11px;font-weight:750}.event-bar{width:4px;align-self:stretch;min-height:38px;border-radius:5px;background:#35b7c9}.event-bar.meeting{background:#3c75b5}.event-bar.council{background:#8b6bc4}.event-bar.site{background:#2e8a68}.event-bar.personal{background:#d49a36}.event-main{flex:1;min-width:0}.event-main b{display:block;font-size:13px}.event-main small{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}.event-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.calendar-layout{grid-template-columns:1fr!important}.calendar-day{min-height:52px;padding:4px 3px}.calendar-day.selected{padding:3px 2px}.day-num{width:21px;height:21px}.day-event-count{display:none}.calendar-grid{gap:3px}.calendar-weekday{font-size:9px;padding:5px 0}.calendar-month{font-size:17px}.calendar-controls{gap:4px}.event-time{min-width:52px}.agenda-event{gap:8px}}</style></head><body><h1><img src="${location.origin}${location.pathname.replace(/[^/]*$/, '')}platinum-pools-logo.png" alt="Platinum Pools NSW" style="width:150px;height:150px;object-fit:contain;background:#050505;border-radius:8px"><br><small>QUOTE DRAFT · ${new Date().toLocaleDateString('en-AU')}</small><h2>${esc(data.title)}</h2><p>Prepared for: ${esc(data.client||'—')}</p><table><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Total</th></tr>${c.items.map(i=>`<tr><td>${esc(i.desc)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${money(i.qty*i.rate)}</td></tr>`).join('')}</table><div class="totals"><p><span>Subtotal</span><b>${money(c.subtotal)}</b></p><p><span>GST</span><b>${money(c.gst)}</b></p><p><strong>Total incl. GST</strong><strong>${money(c.total)}</strong></p></div><div class="notes"><b>Notes / exclusions</b><br>${esc(data.notes||'')}</div><p style="margin-top:40px;color:#777;font-size:11px">Draft generated by Platinum Ops v${VERSION}. Verify all details before issue.</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(k){const [y,m,d]=String(k||dateKey(new Date())).split('-').map(Number);return new Date(y,(m||1)-1,d||1)}
function prettyDate(k){return parseDate(k).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function eventTypeClass(t){return ['meeting','council','site','personal'].includes(t)?t:'other'}
function eventTime(e){return e.allDay?'All day':(e.startTime||'Time TBC')}
function calendar(){const m=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth(),1),selected=state.calendarDate||dateKey(new Date()),start=new Date(m);start.setDate(1-((m.getDay()+6)%7));const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d}),todays=state.events.filter(e=>e.date===selected).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));return `<div class="page-head"><div><div class="eyebrow">PLANNING DESK</div><h3>Calendar & day diary</h3><p>Plan jobs, quote meetings, council appointments and daily notes. Link entries to saved jobs for quick access.</p></div><button class="btn primary" onclick="newEvent('${selected}')">＋ Add entry</button></div><div class="dash-grid calendar-layout" style="grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);align-items:start"><section class="panel calendar-panel"><div class="calendar-toolbar"><div class="calendar-month">${m.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</div><div class="calendar-controls"><button class="btn outline small" onclick="calendarToday()">Today</button><button class="btn outline small" onclick="calendarShift(-1)">←</button><button class="btn outline small" onclick="calendarShift(1)">→</button></div></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${days.map(d=>{const k=dateKey(d),ev=state.events.filter(e=>e.date===k);return `<button class="calendar-day ${d.getMonth()!==m.getMonth()?'outside':''} ${k===selected?'selected':''} ${k===dateKey(new Date())?'today':''}" onclick="selectCalendarDay('${k}')"><span class="day-num">${d.getDate()}</span><span class="day-dots">${ev.slice(0,4).map(e=>`<i class="day-dot ${eventTypeClass(e.type)}"></i>`).join('')}</span><span class="day-event-count">${ev.length?ev.length+' entr'+(ev.length===1?'y':'ies'):''}</span></button>`}).join('')}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:10px;color:var(--muted)">● Job/diary　<span style="color:#3c75b5">● Meetings</span>　<span style="color:#8b6bc4">● Council</span>　<span style="color:#2e8a68">● Site visit</span>　<span style="color:#d49a36">● Personal</span></div></section><section class="panel"><div class="panel-title"><div><h3>Day diary</h3><small>${prettyDate(selected)}</small></div><button class="btn primary small" onclick="newEvent('${selected}')">＋ Add</button></div>${todays.length?todays.map(e=>{const j=state.jobs.find(x=>x.id===e.jobId);return `<div class="agenda-event"><div class="event-time">${esc(eventTime(e))}${e.endTime&&!e.allDay?'<br>– '+esc(e.endTime):''}</div><div class="event-bar ${eventTypeClass(e.type)}"></div><div class="event-main"><b>${esc(e.title)}</b><small>${esc(e.type||'other')}${j?' · '+esc(j.name):''}${e.location?'\\n'+esc(e.location):''}${e.notes?'\\n'+esc(e.notes):''}</small><div class="event-actions">${j?`<button class="btn primary small" onclick="openLinkedJob('${j.id}')">Open job ↗</button>`:''}<button class="btn outline small" onclick="editEvent('${e.id}')">Edit</button><button class="btn danger small" onclick="deleteEvent('${e.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">Nothing planned for this day yet. Add an appointment, site visit or diary note.</div>'}</section></div>${state.editingEvent?eventForm(state.editingEvent):''}<section class="panel" style="margin-top:18px"><div class="panel-title"><h3>Upcoming entries</h3><span>Next 14 days</span></div>${upcomingEvents()}</section>`}
function eventForm(e={}){return `<section class="panel" id="eventEditor" style="margin-top:18px;border-color:var(--gold)"><div class="panel-title"><h3>${e.id?'Edit diary entry':'Add to day diary'}</h3><button class="btn outline small" onclick="cancelEventEdit()">Close</button></div><form onsubmit="saveEvent(event)"><div class="form-grid"><div class="field full"><label>Title *</label><input name="title" required value="${esc(e.title||'')}" placeholder="e.g. Smith quote meeting, council inspection"></div><div class="field"><label>Date *</label><input type="date" name="date" required value="${esc(e.date||state.calendarDate)}"></div><div class="field"><label>Entry type</label><select name="type">${[['job','Job / site work'],['meeting','Quote / client meeting'],['council','Council / approvals'],['site','Site visit'],['personal','Personal / reminder'],['other','Other']].map(([v,l])=>`<option value="${v}" ${(e.type||'meeting')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Start time</label><input type="time" name="startTime" value="${esc(e.startTime||'09:00')}"></div><div class="field"><label>End time</label><input type="time" name="endTime" value="${esc(e.endTime||'09:30')}"></div><div class="field"><label>Link to saved job</label><select name="jobId"><option value="">No linked job</option>${state.jobs.map(j=>`<option value="${esc(j.id)}" ${e.jobId===j.id?'selected':''}>${esc(j.name)}${j.client?' — '+esc(j.client):''}</option>`).join('')}</select></div><div class="field"><label>Location / address</label><input name="location" value="${esc(e.location||'')}" placeholder="Site, council or meeting address"></div><div class="field full"><label>Day notes / checklist</label><textarea name="notes" placeholder="What needs doing? Documents to bring, people to call, approvals to check…">${esc(e.notes||'')}</textarea></div><div class="field"><label><input type="checkbox" name="allDay" value="yes" ${e.allDay?'checked':''} style="width:auto;margin-right:8px">All-day entry</label></div></div><div class="form-actions"><button type="button" class="btn outline" onclick="cancelEventEdit()">Cancel</button><button class="btn primary">Save diary entry</button></div><input type="hidden" name="id" value="${esc(e.id||'')}"></form></section>`}
function newEvent(date){state.editingEvent={date:date||state.calendarDate,type:'meeting',startTime:'09:00',endTime:'09:30'};render();setTimeout(()=>document.querySelector('#eventEditor')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}
function editEvent(id){state.editingEvent=state.events.find(e=>e.id===id)||null;render();setTimeout(()=>document.querySelector('#eventEditor')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}
function cancelEventEdit(){state.editingEvent=null;render()}
function saveEvent(ev){ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f).entries());d.allDay=f.elements.allDay.checked;const id=d.id||crypto.randomUUID(),obj={...d,id,updated:new Date().toISOString()},i=state.events.findIndex(e=>e.id===id);if(i>=0)state.events[i]=obj;else state.events.push(obj);state.calendarDate=d.date;const dt=parseDate(d.date);state.calendarMonth=new Date(dt.getFullYear(),dt.getMonth(),1);state.editingEvent=null;save();toast('Diary entry saved on this device')}
function deleteEvent(id){if(!confirm('Delete this calendar entry?'))return;state.events=state.events.filter(e=>e.id!==id);state.editingEvent=null;save();toast('Calendar entry deleted')}
function selectCalendarDay(k){state.calendarDate=k;state.editingEvent=null;render()}
function calendarShift(n){state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()+n,1);render()}
function calendarToday(){state.calendarDate=dateKey(new Date());state.calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}
function openLinkedJob(id){state.editingJob=state.jobs.find(j=>j.id===id)||null;state.page='jobs';render(true);window.scrollTo(0,0)}
function upcomingEvents(){const today=dateKey(new Date()),end=new Date();end.setDate(end.getDate()+14);const evs=state.events.filter(e=>e.date>=today&&e.date<=dateKey(end)).sort((a,b)=>(a.date+(a.startTime||'')).localeCompare(b.date+(b.startTime||'')));return evs.length?evs.map(e=>{const j=state.jobs.find(x=>x.id===e.jobId);return `<div class="agenda-event"><div class="event-time">${parseDate(e.date).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}<br>${esc(eventTime(e))}</div><div class="event-bar ${eventTypeClass(e.type)}"></div><div class="event-main"><b>${esc(e.title)}</b><small>${esc(e.type||'other')}${j?' · '+esc(j.name):''}</small><div class="event-actions"><button class="btn outline small" onclick="selectCalendarDay('${e.date}')">View day</button>${j?`<button class="btn primary small" onclick="openLinkedJob('${j.id}')">Open job ↗</button>`:''}<button class="btn outline small" onclick="editEvent('${e.id}')">Edit</button></div></div></div>`}).join(''):'<div class="empty">No upcoming entries in the next 14 days.</div>'}

function earthworks(){return `<div class="page-head"><div><div class="eyebrow">SITE ESTIMATING</div><h3>Earthworks calculator</h3><p>Quick excavation volume and truck/load allowance estimates.</p></div></div><div class="notice">Simplified geometric estimate only. Check pool shape, batter, working room, rock, groundwater, over-excavation and disposal rules with the actual excavation plan and contractor.</div><div class="dash-grid"><section class="panel"><div class="panel-title"><h3>Excavation volume</h3><span>Metric units</span></div><form id="earthForm" oninput="calcEarth()"><div class="form-grid"><div class="field"><label>Shape</label><select id="shape"><option value="rect">Rectangular</option><option value="cyl">Circular</option></select></div><div class="field"><label>Average depth (m)</label><input id="depth" type="number" min="0" step="0.01" value="1.8"></div><div class="field" id="lenField"><label>Length (m)</label><input id="len" type="number" min="0" step="0.1" value="8"></div><div class="field" id="widField"><label>Width (m)</label><input id="wid" type="number" min="0" step="0.1" value="4"></div><div class="field hidden" id="diaField"><label>Diameter (m)</label><input id="dia" type="number" min="0" step="0.1" value="4"></div><div class="field"><label>Bulking / swell (%)</label><input id="swell" type="number" min="0" step="1" value="25"></div><div class="field"><label>Truck capacity (loose m³)</label><input id="truck" type="number" min="0.1" step="0.5" value="10"></div><div class="field"><label>Disposal rate ($ / loose m³)</label><input id="rate" type="number" min="0" step="1" value="0"></div></div></form><div class="calc-result"><div><small>In-situ excavation</small><br><b id="bankVol">57.60 m³</b></div><div><small>Loose volume</small><br><b id="looseVol">72.00 m³</b></div></div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:0"><div class="stat"><div class="label">Estimated truckloads</div><div class="num" id="loads">8</div><div class="hint">Rounded up</div></div><div class="stat"><div class="label">Disposal allowance</div><div class="num" id="disposal" style="font-size:22px">$0.00</div><div class="hint">Excludes other charges</div></div></div></section><section class="panel"><div class="panel-title"><h3>What this estimates</h3></div><div class="job-list"><div class="job-row"><div class="job-symbol">1</div><div class="job-info"><b>Bank volume</b><small>Excavated ground in its natural state.</small></div></div><div class="job-row"><div class="job-symbol">2</div><div class="job-info"><b>Loose volume</b><small>Bank volume increased by the swell allowance.</small></div></div><div class="job-row"><div class="job-symbol">3</div><div class="job-info"><b>Truckloads</b><small>Loose volume divided by assumed truck capacity, rounded up.</small></div></div><div class="job-row"><div class="job-symbol">4</div><div class="job-info"><b>Disposal allowance</b><small>Loose volume multiplied by your entered disposal rate.</small></div></div></div><p style="font-size:12px;color:var(--muted);margin-top:20px">For sloping sides or irregular shapes, split the excavation into simpler sections or use a surveyed/engineered volume. This calculator does not infer soil classification or legal disposal requirements.</p></section></div>`}
function calcEarth(){const shape=$('#shape')?.value;if(!shape)return;const depth=Number($('#depth').value)||0;let area=0;if(shape==='rect'){area=(Number($('#len').value)||0)*(Number($('#wid').value)||0)}else area=Math.PI*Math.pow((Number($('#dia').value)||0)/2,2);const bank=area*depth,loose=bank*(1+(Number($('#swell').value)||0)/100),truck=Number($('#truck').value)||0,rate=Number($('#rate').value)||0;$('#bankVol').textContent=bank.toFixed(2)+' m³';$('#looseVol').textContent=loose.toFixed(2)+' m³';$('#loads').textContent=truck>0?Math.ceil(loose/truck):'—';$('#disposal').textContent=money(loose*rate);$('#lenField').classList.toggle('hidden',shape!=='rect');$('#widField').classList.toggle('hidden',shape!=='rect');$('#diaField').classList.toggle('hidden',shape!=='cyl')}
function resources(){const links=[['NSW Swimming Pool Register','Register and compliance information','https://www.swimmingpoolregister.nsw.gov.au/','▣'],['NSW pool safety','Pool safety requirements and guidance','https://www.nsw.gov.au/housing-and-construction/safety-home/pool-safety','⌂'],['NSW Planning Portal','Planning pathways, controls and approvals','https://www.planningportal.nsw.gov.au/','⌘'],['NSW legislation','Current Acts and Regulations (verify applicable provisions)','https://legislation.nsw.gov.au/','§'],['SafeWork NSW','Work health and safety guidance','https://www.safework.nsw.gov.au/','＋'],['Before You Dig Australia','Underground asset information before excavation','https://www.byda.com.au/','⌁'],['Bureau of Meteorology','Weather forecasts and warnings','https://www.bom.gov.au/','☼'],['Platinum Pools NSW website','Company website and pool ranges','https://www.platinumpoolsnsw.com.au/','◇']];return `<div class="page-head"><div><div class="eyebrow">REFERENCE DESK</div><h3>NSW resources</h3><p>Fast links for pool safety, planning and site work.</p></div></div><div class="notice">Quick links only, not a compliance determination. Requirements vary by council, property, approval pathway and project date. Confirm current rules and the relevant local council requirements for every job.</div><div class="link-list">${links.map(l=>`<a class="resource" href="${l[2]}" target="_blank" rel="noopener"><span class="r-ico">${l[3]}</span><span><b>${l[0]} ↗</b><small>${l[1]}</small></span></a>`).join('')}</div><section class="panel" style="margin-top:18px"><div class="panel-title"><h3>Local council shortcuts</h3><span>Illawarra / South Coast</span></div><div class="link-list"><a class="resource" href="https://www.shellharbour.nsw.gov.au/" target="_blank" rel="noopener"><span class="r-ico">⌂</span><span><b>Shellharbour City Council ↗</b><small>Local planning and pool information</small></span></a><a class="resource" href="https://www.kiama.nsw.gov.au/" target="_blank" rel="noopener"><span class="r-ico">⌂</span><span><b>Kiama Municipal Council ↗</b><small>Local planning and pool information</small></span></a><a class="resource" href="https://www.wollongong.nsw.gov.au/" target="_blank" rel="noopener"><span class="r-ico">⌂</span><span><b>Wollongong City Council ↗</b><small>Local planning and pool information</small></span></a><a class="resource" href="https://www.wollondilly.nsw.gov.au/" target="_blank" rel="noopener"><span class="r-ico">⌂</span><span><b>Other council</b><small>Replace with the project’s local council</small></span></a></div></section>`}
function exportData(){const blob=new Blob([JSON.stringify({version:VERSION,exportedAt:new Date().toISOString(),jobs:state.jobs,quotes:state.quotes,events:state.events},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='platinum-ops-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.jobs)||!Array.isArray(d.quotes))throw new Error('Invalid backup');if(!confirm('Import will replace the jobs and quotes stored on this device. Continue?'))return;state.jobs=d.jobs;state.quotes=d.quotes;state.events=Array.isArray(d.events)?d.events:[];save();toast('Backup imported')}catch(err){alert('Could not import this backup file.')}e.target.value=''};r.readAsText(f)}
function render(form=false){setNav();const app=$('#app');if(state.page==='dashboard')app.innerHTML=dashboard();else if(state.page==='jobs')app.innerHTML=jobsPage(form);else if(state.page==='quotes')app.innerHTML=quotePage(form);else if(state.page==='calendar')app.innerHTML=calendar();else if(state.page==='earthworks')app.innerHTML=earthworks();else app.innerHTML=resources();if(state.page==='quotes'&&form){document.querySelectorAll('#quoteItems input,[name="gst"]').forEach(x=>x.addEventListener('input',calcQuote));calcQuote()}if(state.page==='earthworks')calcEarth()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
load();render();
if('serviceWorker'in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});reg.update();reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Update installed — refreshing');});});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('sw-reloaded')){sessionStorage.setItem('sw-reloaded','1');location.reload()} });}catch(e){console.log('Service worker registration failed',e)}})}
</script></body></html>
